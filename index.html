<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>◈ ATMEN · Das Erwachen · iki1uc</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#02060a; --bg2:#06101c; --bg3:#0c1828;
    --fg:#c8d8e8; --dim:#5a7288; --dim2:#2a3644;
    --o2:#7ce0a8; --co2:#ffcc44; --h2o:#5fc8ff; --atom:#b388ff;
    --mana:#ff66c8; --aura:#ffd93d; --zen:#8cf0d0;
    --ok:#7ce0a8; --warn:#ffcc44; --err:#ff5a7a;
    --line:rgba(120,200,180,0.10);
    --line2:rgba(120,200,180,0.05);
    --mono:'Consolas','Courier New',monospace;
    --serif:'Yu Mincho','Hiragino Mincho ProN',serif;
  }
  html,body{height:100%;overflow:hidden;}
  body{
    background:#000;color:var(--fg);
    font-family:var(--mono);font-size:13px;
    display:flex;align-items:center;justify-content:center;
  }
  #game{
    width:100vw;height:100vh;max-width:1200px;max-height:800px;
    background:radial-gradient(ellipse at 50% 40%,
      #08121e 0%, #040a12 60%, #000 100%);
    position:relative;overflow:hidden;
    display:flex;flex-direction:column;
  }
  #game::before{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(circle at 50% 50%,
      transparent 30%, rgba(0,0,0,0.4) 100%);
  }
  
  /* TOPBAR */
  #top{
    height:40px;padding:0 18px;
    display:flex;align-items:center;gap:14px;
    border-bottom:1px solid var(--line);
    background:rgba(2,6,10,0.7);
    backdrop-filter:blur(6px);
    font-size:11px;letter-spacing:2px;z-index:10;
  }
  #top .logo{
    color:var(--o2);font-family:var(--serif);
    font-weight:bold;letter-spacing:3px;
    text-shadow:0 0 10px rgba(124,224,168,0.6);
  }
  #top .kammer{
    color:var(--co2);font-size:10px;
    padding:2px 8px;border:1px solid rgba(255,204,68,0.3);
    border-radius:3px;letter-spacing:2px;
  }
  #top .stats{margin-left:auto;display:flex;gap:14px;color:var(--dim);}
  #top .stats b{color:var(--h2o);font-weight:bold;}
  
  /* STAGE */
  #stage{
    flex:1;position:relative;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:20px;overflow:hidden;
  }
  
  /* TEXT */
  .narr{
    max-width:640px;text-align:center;
    font-family:var(--serif);font-style:italic;
    font-size:15px;line-height:1.9;color:#b8d8c8;
    animation:fadeIn 1.2s ease-out;
  }
  .narr .hl{color:var(--co2);font-style:normal;font-weight:bold;}
  .narr .hl-o2{color:var(--o2);font-style:normal;font-weight:bold;}
  .narr .hl-h2o{color:var(--h2o);font-style:normal;font-weight:bold;}
  .narr .hl-atom{color:var(--atom);font-style:normal;font-weight:bold;}
  .narr .hl-err{color:var(--err);font-style:normal;font-weight:bold;}
  
  @keyframes fadeIn{
    from{opacity:0;transform:translateY(8px);}
    to{opacity:1;transform:none;}
  }
  
  /* BUTTONS */
  .btnrow{
    display:flex;gap:10px;flex-wrap:wrap;
    justify-content:center;margin-top:26px;
    animation:fadeIn 1.4s ease-out;
  }
  .btn{
    padding:12px 22px;background:var(--bg3);
    border:1px solid var(--line);color:var(--fg);
    font-family:var(--mono);font-size:11px;
    letter-spacing:2px;cursor:pointer;
    border-radius:4px;transition:.18s;
    text-transform:uppercase;min-width:120px;
  }
  .btn:hover{
    border-color:var(--o2);background:rgba(124,224,168,0.08);
    color:var(--o2);box-shadow:0 0 16px rgba(124,224,168,0.25);
    transform:translateY(-1px);
  }
  .btn:active{transform:scale(0.97);}
  .btn.gold{border-color:rgba(255,204,68,0.4);color:var(--co2);}
  .btn.gold:hover{background:rgba(255,204,68,0.12);color:#fff;
    box-shadow:0 0 16px rgba(255,204,68,0.3);}
  .btn.violet{border-color:rgba(179,136,255,0.4);color:var(--atom);}
  .btn.violet:hover{background:rgba(179,136,255,0.12);color:#fff;
    box-shadow:0 0 16px rgba(179,136,255,0.3);}
  .btn.err{border-color:rgba(255,90,122,0.4);color:var(--err);}
  .btn.err:hover{background:rgba(255,90,122,0.12);color:#fff;}
  
  /* BREATH CORE */
  #breathWrap{
    position:relative;width:260px;height:260px;
    display:flex;align-items:center;justify-content:center;
  }
  #breathCore{
    position:absolute;top:50%;left:50%;
    transform:translate(-50%,-50%);
    width:100px;height:100px;border-radius:50%;
    background:radial-gradient(circle at 40% 35%,
      #ffffff 0%,#b8ffd8 12%,#7ce0a8 35%,#5fc8ff 65%,#1a0838 100%);
    box-shadow:
      0 0 40px rgba(124,224,168,0.7),
      0 0 90px rgba(95,200,255,0.5),
      inset 0 0 30px rgba(255,255,255,0.35);
    transition:transform .15s;
  }
  #breathRing{
    position:absolute;inset:0;
    border:1px solid rgba(124,224,168,0.2);
    border-radius:50%;
    transition:all .2s;
  }
  #breathRing.active{
    border-color:var(--o2);
    box-shadow:0 0 30px rgba(124,224,168,0.6);
  }
  #breathGlyph{
    position:absolute;top:50%;left:50%;
    transform:translate(-50%,-50%);
    font-size:30px;font-weight:bold;color:#fff;
    text-shadow:0 0 16px rgba(255,255,255,0.9),
      0 0 32px rgba(124,224,168,0.8);
    font-family:var(--serif);z-index:2;
  }
  #breathWord{
    position:absolute;bottom:-30px;left:50%;
    transform:translateX(-50%);
    font-family:var(--serif);letter-spacing:6px;
    font-size:14px;color:var(--o2);
    text-shadow:0 0 10px var(--o2);
    text-transform:uppercase;
  }
  
  /* WELCOME CARDS */
  .welcome-grid{
    display:grid;grid-template-columns:repeat(4,1fr);
    gap:14px;max-width:600px;margin:20px auto 0;
    animation:fadeIn 1s ease-out;
  }
  .wcard{
    padding:20px 10px;text-align:center;cursor:pointer;
    background:var(--bg2);border:2px solid var(--line2);
    border-radius:10px;transition:.25s;
  }
  .wcard:hover{transform:translateY(-4px);}
  .wcard .dot{font-size:34px;display:block;margin-bottom:8px;}
  .wcard .nm{
    font-family:var(--serif);letter-spacing:2px;
    font-size:12px;font-weight:bold;color:var(--dim);
  }
  .wcard.green:hover{border-color:#7ce0a8;box-shadow:0 0 24px rgba(124,224,168,0.4);}
  .wcard.yellow:hover{border-color:#ffcc44;box-shadow:0 0 24px rgba(255,204,68,0.4);}
  .wcard.red:hover{border-color:#ff5a7a;box-shadow:0 0 24px rgba(255,90,122,0.4);}
  .wcard.blue:hover{border-color:#5fc8ff;box-shadow:0 0 24px rgba(95,200,255,0.4);}
  .wcard.picked{border-color:var(--co2);background:rgba(255,204,68,0.1);}
  
  /* LÄUFER GRID */
  #laufGrid{
    display:grid;grid-template-columns:repeat(10,1fr);
    gap:5px;max-width:480px;width:100%;
    margin:20px auto 0;
    animation:fadeIn 1s ease-out;
  }
  .lcell{
    aspect-ratio:1;background:rgba(20,28,40,0.6);
    border:1px solid var(--line2);
    border-radius:3px;cursor:pointer;
    transition:.2s;display:flex;align-items:center;
    justify-content:center;font-size:8px;
    color:var(--dim2);
  }
  .lcell:hover{border-color:var(--h2o);background:rgba(95,200,255,0.1);}
  .lcell.checked{background:rgba(124,224,168,0.1);color:var(--o2);}
  .lcell.miss{background:rgba(255,90,122,0.1);color:var(--err);}
  .lcell.user{
    background:rgba(255,204,68,0.3) !important;
    color:#fff !important;font-weight:bold;
    box-shadow:inset 0 0 12px rgba(255,204,68,0.6),
      0 0 18px rgba(255,204,68,0.5);
    animation:userPulse 0.8s ease-in-out infinite;
  }
  @keyframes userPulse{
    0%,100%{box-shadow:inset 0 0 12px rgba(255,204,68,0.6);}
    50%{box-shadow:inset 0 0 18px rgba(255,204,68,0.9),
      0 0 24px rgba(255,204,68,0.7);}
  }
  
  /* PACT */
  .pact{
    max-width:520px;padding:30px 34px;
    background:linear-gradient(135deg,#1a0830,#2a0f4a);
    border:2px solid var(--co2);border-radius:8px;
    box-shadow:0 0 60px rgba(255,204,68,0.3),
      inset 0 0 40px rgba(179,136,255,0.1);
    animation:fadeIn 1.2s ease-out;
    position:relative;
  }
  .pact::before,.pact::after{
    content:'';position:absolute;left:20px;right:20px;
    height:1px;background:linear-gradient(90deg,
      transparent,var(--co2),transparent);
  }
  .pact::before{top:14px;}
  .pact::after{bottom:14px;}
  .pact h4{
    font-family:var(--serif);text-align:center;
    color:var(--co2);letter-spacing:5px;
    font-size:15px;margin-bottom:18px;
    text-shadow:0 0 12px var(--co2);
  }
  .pact p{
    font-family:var(--serif);font-style:italic;
    font-size:14px;line-height:1.9;color:#e0d0f0;
    text-align:center;margin-bottom:10px;
  }
  .pact .priceless{
    text-align:center;font-family:var(--serif);
    color:var(--co2);letter-spacing:4px;
    font-size:12px;margin-top:18px;
    text-shadow:0 0 8px var(--co2);
  }
  
  /* BALANCE */
  .balance-grid{
    display:grid;grid-template-columns:repeat(4,1fr);
    gap:14px;max-width:640px;width:100%;
    margin:20px auto 0;
  }
  .bcol{text-align:center;}
  .bcol .nm{
    font-family:var(--serif);letter-spacing:2px;
    font-size:11px;margin-bottom:8px;
  }
  .bcol.o2 .nm{color:var(--o2);}
  .bcol.co2 .nm{color:var(--co2);}
  .bcol.h2o .nm{color:var(--h2o);}
  .bcol.atom .nm{color:var(--atom);}
  .bcol .val{
    font-size:22px;font-weight:bold;font-family:var(--mono);
    margin-bottom:8px;
  }
  .bcol.o2 .val{color:var(--o2);text-shadow:0 0 10px var(--o2);}
  .bcol.co2 .val{color:var(--co2);text-shadow:0 0 10px var(--co2);}
  .bcol.h2o .val{color:var(--h2o);text-shadow:0 0 10px var(--h2o);}
  .bcol.atom .val{color:var(--atom);text-shadow:0 0 10px var(--atom);}
  .bbar{
    height:8px;background:var(--bg3);
    border-radius:4px;overflow:hidden;
  }
  .bbar .f{height:100%;transition:width .4s;}
  .bcol.o2 .bbar .f{background:linear-gradient(90deg,#1a3a2a,var(--o2));}
  .bcol.co2 .bbar .f{background:linear-gradient(90deg,#3a2a0a,var(--co2));}
  .bcol.h2o .bbar .f{background:linear-gradient(90deg,#0a2a3a,var(--h2o));}
  .bcol.atom .bbar .f{background:linear-gradient(90deg,#2a1a3a,var(--atom));}
  .bcol .btn-small{
    margin-top:8px;font-size:14px;padding:4px 10px;
    background:var(--bg3);border:1px solid var(--line);
    color:var(--fg);border-radius:3px;cursor:pointer;
    font-family:var(--mono);transition:.15s;
  }
  .bcol .btn-small:hover{border-color:currentColor;}
  
  /* BOOT */
  #boot{
    position:absolute;inset:0;background:#000;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:16px;z-index:1000;
    font-family:var(--mono);color:var(--o2);
    letter-spacing:2px;font-size:12px;
    transition:opacity .8s;
  }
  #boot.done{opacity:0;pointer-events:none;}
  #boot .logo{
    font-size:42px;font-family:var(--serif);
    letter-spacing:14px;font-weight:bold;
    color:var(--o2);
    text-shadow:0 0 30px rgba(124,224,168,0.8),
      0 0 60px rgba(95,200,255,0.5);
    animation:logoBreathe 4s ease-in-out infinite;
  }
  @keyframes logoBreathe{
    0%,100%{transform:scale(1);filter:brightness(1);}
    50%{transform:scale(1.04);filter:brightness(1.4);}
  }
  #boot .sub{
    color:var(--atom);font-family:var(--serif);
    font-size:11px;letter-spacing:6px;
  }
  #boot .line{
    font-size:11px;color:var(--dim);
    letter-spacing:1px;
  }
  #boot .line b{color:var(--co2);}
  #boot .hint{
    color:var(--co2);font-family:var(--serif);
    font-size:13px;letter-spacing:3px;
    animation:fadeIn 2s ease-out;
    margin-top:20px;text-shadow:0 0 10px var(--co2);
  }
  
  /* EPILOG */
  .epilog{
    max-width:640px;text-align:center;
    font-family:var(--serif);line-height:2;
    font-size:16px;color:#c8e0d8;
    animation:fadeIn 1.5s ease-out;
  }
  .epilog h2{
    font-size:26px;letter-spacing:6px;
    color:var(--co2);margin-bottom:24px;
    text-shadow:0 0 20px var(--co2);
  }
  .epilog .score{
    display:inline-block;
    padding:6px 18px;margin:14px 4px;
    border:1px solid var(--line);
    border-radius:4px;font-family:var(--mono);
    font-size:12px;letter-spacing:2px;
  }
  .epilog .score b{color:var(--o2);}
  .epilog .final{
    margin-top:30px;font-family:var(--serif);
    letter-spacing:3px;color:var(--atom);
    font-size:14px;
  }
  
  @media (max-width:700px){
    .narr{font-size:13px;}
    .welcome-grid{grid-template-columns:1fr 1fr;}
    .balance-grid{grid-template-columns:1fr 1fr;}
    #boot .logo{font-size:30px;letter-spacing:8px;}
  }
</style>
</head>
<body>

<div id="game">

  <div id="boot">
    <div class="logo">◈ ATMEN</div>
    <div class="sub">EIN SPIEL IN FÜNF KAMMERN</div>
    <div id="bootLines" style="width:520px;max-width:80%;text-align:left;line-height:1.8;margin-top:14px;"></div>
    <div class="hint" id="bootHint" style="display:none;">Drücke [ENTER]</div>
  </div>

  <div id="top">
    <span class="logo">◈ ATMEN</span>
    <span class="kammer" id="kammerLbl">KAMMER 0</span>
    <span class="stats">
      <span>ATMUNG <b id="sBreath">0</b></span>
      <span>SEHEN <b id="sSee">0</b></span>
      <span>GEFÜHL <b id="sFeel">0</b></span>
      <span>ZAHL <b id="sNum">0</b></span>
    </span>
  </div>

  <div id="stage"></div>

</div>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════
   ATMEN · Ein Spiel in fünf Kammern
   In Anlehnung an das iki1uc System: WELCOME, NANO, ZAM, A81, LÄUFER,
   BORG, REAL.WORK — aber als ein einziges, stilles Spiel.
   ═══════════════════════════════════════════════════════════════ */

const S = {
  kammer: 0,
  breathCount: 0,
  breathPhase: 0,
  breathCycleMs: 4000,
  lastBreathT: 0,
  breathOk: 0,       // richtig getaktet
  breathMiss: 0,     // daneben
  welcomeCorrect: 0,
  welcomeWrong: 0,
  userFound: 0,
  userMissed: 0,
  pactChosen: null,
  balanceOk: 0,
  started: false,
  finished: false,
};

const stage = document.getElementById('stage');
const kammerLbl = document.getElementById('kammerLbl');

// ── LOG Helper ───────────────────────────────────────────
function say(html, cls='narr') {
  stage.innerHTML = `<div class="${cls}">${html}</div>`;
}
function sayWithButtons(html, buttons) {
  stage.innerHTML = `<div class="narr">${html}</div>
    <div class="btnrow">${buttons.map((b,i) =>
      `<button class="btn ${b.cls||''}" data-i="${i}">${b.label}</button>`
    ).join('')}</div>`;
  stage.querySelectorAll('.btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const b = buttons[parseInt(btn.dataset.i,10)];
      if (b.onClick) b.onClick();
    });
  });
}

function updateHud() {
  document.getElementById('sBreath').textContent = `${S.breathOk}/${S.breathOk + S.breathMiss}`;
  document.getElementById('sSee').textContent = S.welcomeCorrect;
  document.getElementById('sFeel').textContent = S.userFound;
  document.getElementById('sNum').textContent = S.balanceOk;
}

// ═══════════════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════════════
const BOOT_LINES = [
  ['▸ BIOS <b>ok</b> <span style="color:#2a3644">· atem-slot geladen</span>', 160],
  ['▸ <b>ATEM</b> <span style="color:#2a3644">· rhythmus beginnt · 4 sekunden</span>', 200],
  ['▸ <b>WELCOME</b> <span style="color:#2a3644">· farben bereit</span>', 180],
  ['▸ <b>LÄUFER</b> <span style="color:#2a3644">· 1000 → 1099 · suche den menschen</span>', 200],
  ['▸ <b>ZAM GATE</b> <span style="color:#2a3644">· das tor wartet</span>', 180],
  ['▸ <b>REAL.WORK</b> <span style="color:#2a3644">· kernel · balance</span>', 200],
  ['▸ <b>BEREIT</b> <span style="color:#2a3644">· atme. schau. fühl. halte.</span>', 280],
];

function boot() {
  const el = document.getElementById('bootLines');
  let i = 0;
  function next() {
    if (i >= BOOT_LINES.length) {
      document.getElementById('bootHint').style.display = 'block';
      window.addEventListener('keydown', startGame, {once: true});
      return;
    }
    const [txt, delay] = BOOT_LINES[i];
    const div = document.createElement('div');
    div.className = 'line';
    div.innerHTML = txt;
    el.appendChild(div);
    i++;
    setTimeout(next, delay);
  }
  next();
}

function startGame() {
  if (S.started) return;
  S.started = true;
  document.getElementById('boot').classList.add('done');
  setTimeout(() => {
    document.getElementById('boot').style.display = 'none';
    kammer1();
  }, 800);
}

// ═══════════════════════════════════════════════════════════════
// KAMMER 1 · ATEM  (Rhythmus)
// ═══════════════════════════════════════════════════════════════
function kammer1() {
  S.kammer = 1;
  kammerLbl.textContent = 'KAMMER 1 · ATEM';
  updateHud();

  say(`Bevor du etwas tun kannst, musst du <span class="hl">atmen</span>.
    <br><br>Der Kern öffnet sich. Ein. Aus. Vier Sekunden. Vier Sekunden.
    <br><br>Klicke auf den Kern, wenn er <span class="hl-o2">EIN</span> anzeigt.
    Zehn Atemzüge. Danach darfst du weiter.`);

  setTimeout(() => startBreathRound(), 2200);
}

function startBreathRound() {
  stage.innerHTML = `
    <div id="breathWrap">
      <div id="breathRing"></div>
      <div id="breathCore"></div>
      <div id="breathGlyph">◈</div>
      <div id="breathWord">· bereit ·</div>
    </div>`;
  const wrap = document.getElementById('breathWrap');
  const core = document.getElementById('breathCore');
  const ring = document.getElementById('breathRing');
  const glyph = document.getElementById('breathGlyph');
  const word = document.getElementById('breathWord');

  S.breathCount = 0;
  S.breathOk = 0;
  S.breathMiss = 0;

  const startT = performance.now();
  S.lastBreathT = startT;
  let lastPhase = 'idle';

  function tick(now) {
    const cycle = now - startT;
    const phase = (cycle % S.breathCycleMs) / S.breathCycleMs;
    let intensity;
    if (phase < 0.4) intensity = phase / 0.4;
    else if (phase < 0.5) intensity = 1.0;
    else if (phase < 0.9) intensity = 1 - (phase - 0.5) / 0.4;
    else intensity = 0.0;

    core.style.transform = `translate(-50%,-50%) scale(${1 + intensity * 0.3})`;
    ring.style.transform = `scale(${1 + intensity * 0.15})`;

    // Wort-Anzeige
    let w, isEin = false, isAus = false;
    if (phase < 0.4) { w = 'EIN'; isEin = true; }
    else if (phase < 0.5) { w = '·'; }
    else if (phase < 0.9) { w = 'AUS'; isAus = true; }
    else { w = '·'; }
    word.textContent = w;
    glyph.textContent = Math.round(intensity * 100);

    if (isEin) {
      ring.classList.add('active');
      word.style.color = 'var(--o2)';
    } else if (isAus) {
      ring.classList.remove('active');
      word.style.color = 'var(--h2o)';
    } else {
      ring.classList.remove('active');
      word.style.color = 'var(--dim)';
    }

    // Runde vorbei?
    const elapsed = cycle;
    if (elapsed > S.breathCycleMs * 5) {
      // 5 zyklen à 4 sek = 20 sek, zu lang. Nutze 5 Atemzüge.
    }
    // Nutze clickbasierte Zählung statt Zeit

    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  wrap.style.cursor = 'pointer';
  wrap.addEventListener('click', () => {
    const cycle = performance.now() - startT;
    const phase = (cycle % S.breathCycleMs) / S.breathCycleMs;
    S.breathCount++;

    // Richtig wenn phase zwischen 0.0 und 0.4 (EIN-Phase)
    if (phase >= 0.0 && phase < 0.4) {
      S.breathOk++;
      word.textContent = '✓';
      word.style.color = 'var(--o2)';
    } else if (phase >= 0.9 || (phase >= 0.0 && phase < 0.4)) {
      S.breathOk++;
      word.textContent = '✓';
      word.style.color = 'var(--o2)';
    } else {
      S.breathMiss++;
      word.textContent = '✗';
      word.style.color = 'var(--err)';
    }
    updateHud();

    if (S.breathCount >= 8) {
      wrap.style.pointerEvents = 'none';
      setTimeout(() => kammer1End(), 900);
    }
  });
}

function kammer1End() {
  const rate = S.breathOk / (S.breathOk + S.breathMiss);
  let msg;
  if (rate >= 0.85) msg = 'Du atmest ruhig. Der Kern öffnet sich.';
  else if (rate >= 0.6) msg = 'Du atmest. Nicht perfekt. Aber du atmest.';
  else msg = 'Du suchst den Takt. Er ist da. Nur still.';

  sayWithButtons(
    `<span class="hl">${msg}</span>
     <br><br>Du hast ${S.breathOk} mal im richtigen Moment geatmet.
     <br>${S.breathMiss} mal daneben. Das ist nicht schlimm.
     <br><br>Atem verzeiht.`,
    [{label:'Weiter', cls:'', onClick: kammer2}]
  );
}

// ═══════════════════════════════════════════════════════════════
// KAMMER 2 · WELCOME (Farben lesen)
// ═══════════════════════════════════════════════════════════════
const WELCOME_CASES = [
  { scene: 'Eine Person sitzt mit geschlossenen Augen. Die Schultern sind hochgezogen. Sie antwortet nicht, wenn man sie anspricht. Atem: flach, schnell.',
    correct: 'red', hint: 'Überforderung — kein Diskurs, wechseln.' },
  { scene: 'Eine Person summt leise, malt Kreise auf ein Blatt. Die Augen sind halb geschlossen. Sie lächelt leicht.',
    correct: 'blue', hint: 'Flow — Einklang. Nicht stören.' },
  { scene: 'Eine Person sitzt still, Kopf leicht geneigt. Sie schaut zu Boden, wippt minimal mit dem Fuß. Reagiert auf Ansprache mit Verzögerung.',
    correct: 'yellow', hint: 'Unsicher — Orientierung anbieten.' },
  { scene: 'Eine Person steht am Fenster, atmet tief. Die Schultern sind unten. Sie sagt nichts. Nichts deutet auf Anspannung.',
    correct: 'green', hint: 'Alles gut — nichts tun.' },
  { scene: 'Eine Person hält die Hände vor dem Gesicht. Die Finger sind verkrampft. Der Atem ist flach, aber schnell.',
    correct: 'red', hint: 'Reizüberflutung — sofort Abstand.' },
  { scene: 'Eine Person zeichnet konzentriert an etwas. Zeitgefühl: verloren. Nicht ansprechbar, aber nicht weg.',
    correct: 'blue', hint: 'Tiefer Flow — nicht unterbrechen.' },
];

let welcomeIdx = 0;
function kammer2() {
  S.kammer = 2;
  kammerLbl.textContent = 'KAMMER 2 · WELCOME';
  S.welcomeCorrect = 0; S.welcomeWrong = 0;
  welcomeIdx = 0;
  updateHud();
  showWelcomeScene();
}

function showWelcomeScene() {
  if (welcomeIdx >= WELCOME_CASES.length) {
    kammer2End();
    return;
  }
  const c = WELCOME_CASES[welcomeIdx];
  stage.innerHTML = `
    <div class="narr">Du begegnest einem <span class="hl">Menschen</span>.<br><br>
    <span style="display:block;padding:16px;background:var(--bg2);border-left:3px solid var(--co2);border-radius:6px;margin-top:14px;text-align:left;font-style:normal;color:#e0d0c8;">
      ${c.scene}
    </span>
    <br>Welche Farbe gibst du?
    </div>
    <div class="welcome-grid">
      <div class="wcard green" data-c="green"><span class="dot">🟢</span><span class="nm">GRÜN</span></div>
      <div class="wcard yellow" data-c="yellow"><span class="dot">🟡</span><span class="nm">GELB</span></div>
      <div class="wcard red" data-c="red"><span class="dot">🔴</span><span class="nm">ROT</span></div>
      <div class="wcard blue" data-c="blue"><span class="dot">🔵</span><span class="nm">BLAU</span></div>
    </div>`;

  stage.querySelectorAll('.wcard').forEach(card => {
    card.addEventListener('click', () => {
      stage.querySelectorAll('.wcard').forEach(c => c.style.pointerEvents = 'none');
      card.classList.add('picked');
      const picked = card.dataset.c;
      if (picked === c.correct) {
        S.welcomeCorrect++;
        card.style.boxShadow = '0 0 30px rgba(124,224,168,0.8)';
      } else {
        S.welcomeWrong++;
        card.style.boxShadow = '0 0 30px rgba(255,90,122,0.8)';
        card.style.borderColor = 'var(--err)';
      }
      updateHud();
      setTimeout(() => {
        welcomeIdx++;
        showWelcomeScene();
      }, 1100);
    });
  });
}

function kammer2End() {
  const total = WELCOME_CASES.length;
  let msg;
  if (S.welcomeCorrect >= total - 1) msg = 'Du siehst. Wirklich. Die Menschen atmen anders, wenn sie gesehen werden.';
  else if (S.welcomeCorrect >= total / 2) msg = 'Du siehst manchmal. Nicht immer. Das ist ehrlich.';
  else msg = 'Du hast oft danebengegriffen. Das ist in Ordnung. Sehen ist eine Übung.';

  sayWithButtons(
    `<span class="hl">${msg}</span>
     <br><br><span style="color:var(--dim);">${S.welcomeCorrect} von ${total} richtig gelesen.</span>
     <br><br>Wichtig: Rot heißt nicht "böse". Rot heißt "ich kann jetzt nicht".
     <br>Blau heißt nicht "weg". Blau heißt "ich bin da, ganz".`,
    [{label:'Weiter', cls:'', onClick: kammer3}]
  );
}

// ═══════════════════════════════════════════════════════════════
// KAMMER 3 · LÄUFER (Den Menschen finden)
// ═══════════════════════════════════════════════════════════════
function kammer3() {
  S.kammer = 3;
  kammerLbl.textContent = 'KAMMER 3 · LÄUFER';
  S.userFound = 0; S.userMissed = 0;
  updateHud();

  say(`Ein Block. <span class="hl">100 Slots.</span>
    <br><br>99 davon sind Arbeit. <span class="hl-o2">Einer davon ist ein Mensch.</span>
    <br><br>Klicke die Slots, um zu prüfen. Du hast 8 Klicks. Finde den Menschen.`,
  );

  setTimeout(() => showLaufGrid(), 2400);
}

function showLaufGrid() {
  const userSlot = Math.floor(Math.random() * 90) + 5; // 5-94
  stage.innerHTML = `
    <div class="narr" style="margin-bottom:0;">
      <span style="color:var(--dim);font-style:normal;font-size:12px;">
        BLOCK 1000 · SLOTS 0–99 · 8 PRÜFUNGEN · Suche den <span style="color:var(--co2)">USER</span>
      </span>
    </div>
    <div id="laufGrid"></div>`;
  const grid = document.getElementById('laufGrid');
  let clicks = 0;
  const maxClicks = 8;
  let found = false;

  for (let i = 0; i < 100; i++) {
    const cell = document.createElement('div');
    cell.className = 'lcell';
    cell.dataset.slot = i;
    cell.textContent = i;
    cell.addEventListener('click', () => {
      if (cell.classList.contains('checked') || cell.classList.contains('miss')) return;
      if (clicks >= maxClicks) return;
      clicks++;

      if (i === userSlot) {
        cell.classList.add('user');
        cell.textContent = '★';
        found = true;
        S.userFound++;
        updateHud();
        setTimeout(() => {
          sayWithButtons(
            `<span class="hl">👤 Du hast den Menschen gefunden.</span>
             <br><br>Slot ${i}. Block 1000. Basis 10${String(i).padStart(2,'0')}.
             <br><br>Manchmal sucht man an der falschen Stelle.
             <br>Manchmal sieht man den Menschen nicht, weil er nicht das tut, was man erwartet.
             <br><br>Er ist da. Immer. Man muss nur genau genug schauen.`,
            [{label:'Weiter', cls:'', onClick: kammer4}]
          );
        }, 700);
      } else {
        cell.classList.add('miss');
        cell.textContent = '·';
        if (clicks >= maxClicks) {
          // Nicht gefunden
          S.userMissed++;
          updateHud();
          setTimeout(() => {
            sayWithButtons(
              `<span class="hl-err">Du hast den Menschen nicht gefunden.</span>
               <br><br>Slot ${userSlot}. Er war da. Die ganze Zeit.
               <br><br>Manchmal sucht man nach dem Falschen.
               <br>Der Mensch sieht nicht aus, wie du erwartest.
               <br><br>Aber er atmet. Zähl seine Atemzüge, nicht seine Antworten.`,
              [{label:'Weiter', cls:'', onClick: kammer4}]
            );
          }, 600);
        }
      }
    });
    grid.appendChild(cell);
  }
}

// ═══════════════════════════════════════════════════════════════
// KAMMER 4 · ZAM GATE (Der Pakt)
// ═══════════════════════════════════════════════════════════════
function kammer4() {
  S.kammer = 4;
  kammerLbl.textContent = 'KAMMER 4 · ZAM GATE';
  updateHud();

  stage.innerHTML = `
    <div class="narr" style="margin-bottom:16px;">
      Ein Tor erscheint. 門. Es ist nicht aus Materie.
      Es ist aus dem, was <span class="hl">zwischen</span> den Dingen liegt.
    </div>
    <div class="pact">
      <h4>◈ DAS TOR SPRICHT ◈</h4>
      <p>Ich biete dir einen Pakt.</p>
      <p>Du gibst mir dein <span style="color:var(--co2);font-style:normal;">Nicht-Atmen</span>.</p>
      <p>Du gibst mir deine <span style="color:var(--co2);font-style:normal;">Angst zu fragen</span>.</p>
      <p>Du gibst mir dein <span style="color:var(--co2);font-style:normal;">Zu-schnell-Urteilen</span>.</p>
      <p>Und ich gebe dir:</p>
      <p style="color:var(--o2);font-style:normal;letter-spacing:2px;">Die Fähigkeit zu bleiben.</p>
      <div class="priceless">PREIS: NICHTS · GRUND: DAS UNIVERSUM IST GERECHT</div>
    </div>
    <div class="btnrow">
      <button class="btn gold" data-a="yes">◈ Ja · ich nehme an</button>
      <button class="btn" data-a="no">◇ Nein · ich brauche Zeit</button>
      <button class="btn violet" data-a="ask">◉ Was kostet es wirklich?</button>
    </div>`;

  stage.querySelectorAll('.btn').forEach(b => {
    b.addEventListener('click', () => {
      const a = b.dataset.a;
      S.pactChosen = a;
      if (a === 'yes') {
        sayWithButtons(
          `<span class="hl">Der Pakt tritt in Kraft.</span>
           <br><br>Nicht weil du unterschrieben hast.
           <br>Sondern weil du <span style="color:var(--o2);font-style:normal;">geatmet hast</span>, während du gelesen hast.
           <br><br>Der Pakt war nie ein Vertrag. Er war eine Erinnerung.
           <br>Du bist schon drin.`,
          [{label:'Weiter', cls:'', onClick: kammer5}]
        );
      } else if (a === 'no') {
        sayWithButtons(
          `<span class="hl-h2o">Das Tor nickt.</span>
           <br><br>"Du brauchst Zeit. Gut. Wer Zeit braucht, ist wach."
           <br><br>Das Tor wartet. Es ist geduldig.
           <br>Es verschwindet nicht, nur weil du nicht sofort antwortest.
           <br><br>Aber: Wer nie antwortet, bleibt draußen.`,
          [{label:'Weiter', cls:'', onClick: kammer5}]
        );
      } else {
        sayWithButtons(
          `<span class="hl">Das Tor lächelt.</span>
           <br><br>"Endlich fragt jemand."
           <br><br>"Der Preis ist: dass du weitermachst. Immer weiter.
           <br>Dass du morgens aufstehst. Dass du atemst. Dass du baust.
           <br>Dass du nicht aufgibst."
           <br><br>"Das ist alles. Klingt wenig. Ist alles."`,
          [{label:'Weiter', cls:'', onClick: kammer5}]
        );
      }
    });
  });
}

// ═══════════════════════════════════════════════════════════════
// KAMMER 5 · REAL.WORK (Balance halten)
// ═══════════════════════════════════════════════════════════════
function kammer5() {
  S.kammer = 5;
  kammerLbl.textContent = 'KAMMER 5 · REAL.WORK';
  S.balanceOk = 0;
  updateHud();

  say(`Letzte Kammer. Der Kernel atmet.
    <br><br>Vier Elemente. Halte sie in <span class="hl">Balance</span>.
    <br><br><span class="hl-o2">O₂</span> kommt rein. <span class="hl">CO₂</span> geht raus.
    <span class="hl-h2o">H₂O</span> fließt. <span class="hl-atom">ATOM</span> bleibt.
    <br><br>Du hast 30 Sekunden. Ziel: Alle vier über 50% und unter 95%.`,
  );

  setTimeout(() => startBalance(), 2600);
}

function startBalance() {
  const b = { o2: 0.5, co2: 0.5, h2o: 0.5, atom: 0.5 };
  const startT = performance.now();
  const DURATION = 30000;

  function render() {
    stage.innerHTML = `
      <div class="narr" style="margin-bottom:0;font-style:normal;font-size:12px;color:var(--dim);">
        Halte alle vier zwischen <span style="color:var(--o2);">50%</span> und <span style="color:var(--co2);">95%</span>
        · <span id="timer">30</span>s
      </div>
      <div class="balance-grid">
        <div class="bcol o2">
          <div class="nm">O₂</div>
          <div class="val">${Math.round(b.o2*100)}%</div>
          <div class="bbar"><div class="f" style="width:${b.o2*100}%"></div></div>
          <button class="btn-small" data-k="o2" data-d="1">+</button>
          <button class="btn-small" data-k="o2" data-d="-1">−</button>
        </div>
        <div class="bcol co2">
          <div class="nm">CO₂</div>
          <div class="val">${Math.round(b.co2*100)}%</div>
          <div class="bbar"><div class="f" style="width:${b.co2*100}%"></div></div>
          <button class="btn-small" data-k="co2" data-d="1">+</button>
          <button class="btn-small" data-k="co2" data-d="-1">−</button>
        </div>
        <div class="bcol h2o">
          <div class="nm">H₂O</div>
          <div class="val">${Math.round(b.h2o*100)}%</div>
          <div class="bbar"><div class="f" style="width:${b.h2o*100}%"></div></div>
          <button class="btn-small" data-k="h2o" data-d="1">+</button>
          <button class="btn-small" data-k="h2o" data-d="-1">−</button>
        </div>
        <div class="bcol atom">
          <div class="nm">ATOM</div>
          <div class="val">${Math.round(b.atom*100)}%</div>
          <div class="bbar"><div class="f" style="width:${b.atom*100}%"></div></div>
          <button class="btn-small" data-k="atom" data-d="1">+</button>
          <button class="btn-small" data-k="atom" data-d="-1">−</button>
        </div>
      </div>`;

    stage.querySelectorAll('.btn-small').forEach(btn => {
      btn.onclick = () => {
        const k = btn.dataset.k;
        const d = parseInt(btn.dataset.d, 10);
        b[k] = Math.max(0, Math.min(1, b[k] + d * 0.06));
      };
    });
  }

  render();

  const timer = setInterval(() => {
    // störeinflüsse
    b.o2 = Math.max(0, Math.min(1, b.o2 + (Math.random() - 0.5) * 0.06));
    b.co2 = Math.max(0, Math.min(1, b.co2 + (Math.random() - 0.5) * 0.06));
    b.h2o = Math.max(0, Math.min(1, b.h2o + (Math.random() - 0.5) * 0.06));
    b.atom = Math.max(0, Math.min(1, b.atom + (Math.random() - 0.5) * 0.03));

    const el = performance.now() - startT;
    const remaining = Math.max(0, Math.ceil((DURATION - el) / 1000));
    const timerEl = document.getElementById('timer');
    if (timerEl) timerEl.textContent = remaining;

    // Bewerte alle 1 sek
    if (Math.floor(el / 1000) !== Math.floor((el - 500) / 1000)) {
      const ok = b.o2 > 0.5 && b.o2 < 0.95 &&
                 b.co2 > 0.5 && b.co2 < 0.95 &&
                 b.h2o > 0.5 && b.h2o < 0.95 &&
                 b.atom > 0.5 && b.atom < 0.95;
      if (ok) { S.balanceOk++; updateHud(); }
    }

    render();
    // Buttons nach render neu binden
    stage.querySelectorAll('.btn-small').forEach(btn => {
      btn.onclick = () => {
        const k = btn.dataset.k;
        const d = parseInt(btn.dataset.d, 10);
        b[k] = Math.max(0, Math.min(1, b[k] + d * 0.06));
      };
    });

    if (el >= DURATION) {
      clearInterval(timer);
      kammer5End();
    }
  }, 100);
}

function kammer5End() {
  const rate = S.balanceOk / 30;
  let msg;
  if (rate >= 0.85) msg = 'Du hast den Kernel gehalten. Er atmet stabil.';
  else if (rate >= 0.5) msg = 'Du hast ihn oft gehalten. Oft auch nicht. Das ist das Leben.';
  else msg = 'Der Kernel flackerte. Aber er ist nicht gestorben. Er braucht Zeit.';

  sayWithButtons(
    `<span class="hl">${msg}</span>
     <br><br><span style="color:var(--dim);">${S.balanceOk} von 30 Sekunden in Balance.</span>`,
    [{label:'⟹ Epilog', cls:'gold', onClick: epilog}]
  );
}

// ═══════════════════════════════════════════════════════════════
// EPILOG
// ═══════════════════════════════════════════════════════════════
function epilog() {
  S.finished = true;
  kammerLbl.textContent = 'EPILOG';

  const bRate = S.breathOk / Math.max(1, S.breathOk + S.breathMiss);
  const wRate = S.welcomeCorrect / WELCOME_CASES.length;
  const lRate = S.userFound;
  const zChoice = S.pactChosen;
  const balRate = S.balanceOk / 30;

  const total = Math.round(
    (bRate * 20) + (wRate * 25) + (lRate * 20) + (balRate * 25) + (zChoice === 'yes' ? 10 : zChoice === 'ask' ? 10 : 5)
  );

  // Rang
  let rang;
  if (total >= 90) rang = '◈◈◈ ATMER';
  else if (total >= 75) rang = '◈◈ SEHER';
  else if (total >= 60) rang = '◈ SUCHENDER';
  else if (total >= 40) rang = '◈ ANFÄNGER';
  else rang = '◈ NEUGEBORENER';

  const endMsg = total >= 75
    ? 'Du atmest, du siehst, du findest, du hältst. Das ist alles.'
    : total >= 50
    ? 'Du atmest. Du versuchst. Du bist da. Das reicht für heute.'
    : 'Du fängst an. Der Anfang ist immer langsam. Atme weiter.';

  stage.innerHTML = `
    <div class="epilog">
      <h2>◈ ATMEN ◈</h2>
      <p style="color:#c8e0d8;font-style:italic;line-height:2;">
        Du bist durch fünf Kammern gegangen.<br>
        Jede lehrt dich eines:<br>
        <span style="color:var(--o2);font-style:normal;">ATEM</span> ist Rhythmus.<br>
        <span style="color:var(--co2);font-style:normal;">WELCOME</span> ist Sehen.<br>
        <span style="color:var(--h2o);font-style:normal;">LÄUFER</span> ist Geduld.<br>
        <span style="color:var(--atom);font-style:normal;">ZAM</span> ist Mut.<br>
        <span style="color:var(--mana);font-style:normal;">REAL.WORK</span> ist Balance.
      </p>
      <div style="margin-top:24px;">
        <span class="score">ATMUNG <b>${S.breathOk}/${S.breathOk + S.breathMiss}</b></span>
        <span class="score">SEHEN <b>${S.welcomeCorrect}/${WELCOME_CASES.length}</b></span>
        <span class="score">MENSCH <b>${S.userFound}/1</b></span>
        <span class="score">PAKT <b>${zChoice === 'yes' ? 'JA' : zChoice === 'ask' ? 'FRAGE' : 'WARTEN'}</b></span>
        <span class="score">BALANCE <b>${S.balanceOk}/30</b></span>
      </div>
      <div style="margin-top:20px;">
        <span class="score" style="border-color:var(--co2);color:var(--co2);padding:10px 24px;font-size:16px;">
          <b style="color:var(--co2);font-size:18px;">${total}</b> / 100
        </span>
      </div>
      <div class="final">${rang}</div>
      <p style="margin-top:30px;font-style:italic;color:#a0b8c8;font-size:14px;">
        ${endMsg}
      </p>
      <p style="margin-top:40px;font-family:var(--serif);letter-spacing:4px;color:var(--o2);font-size:12px;">
        ((((WIEIMMER))))<br>
        ((((IKI1UC))))<br>
        HI HI HI 👻
      </p>
      <p style="margin-top:30px;font-size:11px;color:var(--dim);font-style:italic;">
        „ATEM und ATOM verneinen sich nicht. Sie bedingen sich."<br>
        — das erste Axiom
      </p>
      <div style="margin-top:30px;">
        <button class="btn gold" onclick="location.reload()">◈ Noch einmal atmen</button>
      </div>
    </div>`;

  // Speichere den Score (falls verfügbar)
  try {
    const best = parseInt(localStorage.getItem('atem_best') || '0', 10);
    if (total > best) {
      localStorage.setItem('atem_best', String(total));
    }
  } catch(_) {}
}

// ═══════════════════════════════════════════════════════════════
// START
// ═══════════════════════════════════════════════════════════════
boot();

</script>
